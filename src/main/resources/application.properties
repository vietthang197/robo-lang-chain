spring.application.name=robo-lang-chain

nas.path=D:/upload

langchain4j.ollama.chat-model.log-requests=true
langchain4j.ollama.chat-model.log-responses=true

langchain4j.ollama.chat-model.model-name=qwen3.5:9b
langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.temperature=0.0
langchain4j.ollama.chat-model.top-k=64
langchain4j.ollama.chat-model.top-p=0.95
langchain4j.ollama.chat-model.think=true
langchain4j.ollama.chat-model.timeout=300s


langchain4j.ollama.embedding-model.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=qwen3-embedding:latest
langchain4j.ollama.embedding-model.timeout=300s

spring.datasource.url=jdbc:postgresql://localhost:5432/mydatabase
spring.datasource.username=myuser
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=update
